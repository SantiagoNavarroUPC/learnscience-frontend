name: flutter_application
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  youtube_player_flutter:
  video_player:
  dio: 
  pdfx: ^2.9.2
  flutter_pdfview: ^1.0.0
  cupertino_icons: ^1.0.6
  http: ^0.13.5
  get: ^4.6.5
  get_storage: ^2.0.3
  flutter_svg: ^2.0.7
  image_picker: ^1.0.0
  file_picker: ^10.2.0
  firebase_core: ^3.7.0
  firebase_storage: ^12.3.5
  firebase_storage_platform_interface: ^5.1.22
  url_launcher: ^6.0.10
  animate_do: ^3.3.4
  path_provider:
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.10.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/banners/
    - assets/images/games/
    - assets/icons/
    - assets/sounds/
    - assets/palabras.json
    - assets/relaciona_concepto.json


  fonts:
    - family: Glowing Bubble
      fonts:
        - asset: assets/fonts/Glowing Bubble.ttf
    - family: Matemasie
      fonts:
        - asset: assets/fonts/Matemasie.ttf
